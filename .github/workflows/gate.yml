name: gate

on:
  # แยกกันแบบนี้เพื่อไม่ให้รันซ้ำสองรอบ
  # ถ้าเขียน push: เปล่า ๆ คู่กับ pull_request: พอ push ขึ้นกิ่งที่มี PR เปิดอยู่
  # จะรันทั้งสอง event = เผาโควตาเป็นสองเท่าโดยไม่ได้อะไรเพิ่ม
  push:
    branches: [main] # main รันตอน merge เข้ามา
  pull_request: # กิ่งอื่นรันผ่าน PR อย่างเดียว

concurrency:
  # push ซ้ำติด ๆ กัน = ยกเลิกรอบเก่าที่ยังค้าง ไม่ปล่อยให้รันทิ้งจนจบ
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest # linux นับโควตา 1x · windows 2x · macos 10x
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # smoke ใช้ playwright-core ซึ่งไม่โหลดเบราว์เซอร์มาเอง
      # เครื่อง dev ใช้ Edge ที่มีอยู่แล้ว · CI ต้องลง chromium
      - run: npx playwright install --with-deps chromium

      - name: gate --full
        env:
          SMOKE_BROWSER_CHANNEL: chromium
        run: ./gate.sh --full
